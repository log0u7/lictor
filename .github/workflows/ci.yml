name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: log0u7/augure
          path: augure
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Install nmap and gdb (the doctor/scanner/triage check them)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nmap gdb
      - name: Lint
        run: bundle exec standardrb
      - name: gdb timing probe (one-off)
        run: |
          time (echo | gdb -batch -ex run /bin/true)
          bundle exec ruby -e '
            require "augure-profiler"
            gem_path = Bundler.load.specs.find { |s| s.name == "augure-profiler" }.full_gem_path
            require File.join(gem_path, "spec/support/binary_builder")
            t0 = Time.now
            sweep = AugureProfiler::Fuzzer.run(ProfilerBinaryBuilder.vulnerable, inputs: 40, max_len: 1024)
            puts "sweep=#{(Time.now - t0).round(2)}s crashes=#{sweep.size} first=#{sweep.first&.dig(:input)&.bytesize}"
            t1 = Time.now
            r = AugureProfiler::Triage.run(ProfilerBinaryBuilder.vulnerable, AugureProfiler::Triage.cyclic(80))
            puts "gdb=#{(Time.now - t1).round(2)}s signal=#{r[:signal].inspect} rip=#{r.dig(:registers, "rip").inspect}"
          '

      - name: Tests
        run: timeout --signal=QUIT 6m bundle exec rspec --profile

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan history for secrets
        run: gitleaks detect --source . --redact -v
