services:
  targets:
    build: .
    # the lab is the controlled bench: setarch -R (ADDR_NO_RANDOMIZE)
    # needs personality(2), which docker's default seccomp profile
    # blocks - the leak-and-strike demo depends on it
    security_opt:
      - seccomp:unconfined
    # the services crash BY DESIGN (the exploit lands, the wrapper
    # restarts them): without a core limit every crash writes a core
    # file on the host and apport's handling drowns the box (measured:
    # load 120 on 8 cores, 100+ apport processes mid-training)
    ulimits:
      core:
        soft: 0
        hard: 0
    ports:
      - "8000:8000"
      - "9996:9996"
      - "9995:9995"
      - "9994:9994"
      - "8899:8899"
      - "8898:8898"
      - "8897:8897"
      - "9997:9997"
      - "9998:9998"
      - "9999:9999"
      - "9993:9993"
      - "9992:9992"
    restart: unless-stopped
