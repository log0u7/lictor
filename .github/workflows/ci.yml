name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      docs: ${{ steps.diff.outputs.docs }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: diff
        run: |
          CHANGED=$(git diff --name-only HEAD^ HEAD 2>/dev/null || git ls-files)
          if echo "$CHANGED" | grep -qE '^(lib/|spec/|bin/|mcp_server/|lab/|Gemfile|[^/]*\.gemspec|\.github/workflows/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep -qE '\.md$'; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          fi

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Markdown lint (the doc-only CI)
        run: npx --yes markdownlint-cli2 "**/*.md" "#node_modules"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.docs == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # The runner's gdb stalls ~90-180s per batch run (debuginfod is
    # env-disabled and still slow there - a runner-side quirk under
    # investigation); the suite stays green, just slower.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: log0u7/augure
          path: augure
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Install nmap and gdb (the doctor/scanner/triage check them)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nmap gdb
      - name: Lint
        run: bundle exec standardrb
      - name: Tests
        run: bundle exec rspec --profile

  gems:
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: log0u7/augure
          path: augure
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Both gems build (the release artifact is not a dead one)
        run: |
          gem build lictor.gemspec
          (cd mcp_server && gem build lictor-mcp.gemspec)

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan history for secrets
        run: gitleaks detect --source . --redact -v --no-git=false
