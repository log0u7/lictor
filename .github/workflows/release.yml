name: release

on:
  push:
    tags: ["v*"]

jobs:
  push-gems:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Build the two gems
        run: |
          gem build lictor.gemspec
          gem build mcp_server/lictor-mcp.gemspec
      # Order matters: lictor first, lictor-mcp depends on it.
      - name: Push to rubygems.org (scoped key, secrets never logged)
        env:
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          gem push lictor-*.gem --key RUBYGEMS_API_KEY --host https://rubygems.org
          gem push lictor-mcp-*.gem --key RUBYGEMS_API_KEY --host https://rubygems.org
