services:
  targets:
    build: .
    # the lab is the controlled bench: setarch -R (ADDR_NO_RANDOMIZE)
    # needs personality(2), which docker's default seccomp profile
    # blocks - the leak-and-strike demo depends on it
    security_opt:
      - seccomp:unconfined
    ports:
      - "8000:8000"
      - "9996:9996"
      - "9995:9995"
      - "9994:9994"
      - "9997:9997"
      - "9998:9998"
      - "9999:9999"
    restart: unless-stopped
