name: release

on:
  push:
    tags: ["v*"]

jobs:
  push-gems:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Build the two gems
        # the mcp gem is built from its own directory: the executables
        # resolve relative to the CWD, and exe/lictor-mcp lives under
        # mcp_server/ (building from the root made every release fail)
        run: |
          gem build lictor.gemspec
          (cd mcp_server && gem build lictor-mcp.gemspec)
      # Order matters: lictor first, lictor-mcp depends on it.
      - name: Push to rubygems.org (scoped key, secrets never logged)
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          gem push lictor-*.gem --host https://rubygems.org
          gem push mcp_server/lictor-mcp-*.gem --host https://rubygems.org
